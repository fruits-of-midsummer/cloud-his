services:
  mysql:
    image: mysql:8.0.44
    environment:
      MYSQL_DATABASE: cloud_his
      MYSQL_USER: his
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在.env中设置DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在.env中设置MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u his --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
  app:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://mysql:3306/cloud_his?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      DB_USER: his
      DB_PASSWORD: ${DB_PASSWORD}
      HIS_INITIAL_PASSWORD: ${HIS_INITIAL_PASSWORD:?请设置初始账号密码}
      HIS_SEED: ${HIS_SEED:-false}
    depends_on:
      mysql: {condition: service_healthy}
volumes:
  mysql_data:
